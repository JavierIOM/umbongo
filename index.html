<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>umbo.ngo</title>
  <meta name="description" content="Short links, made quick." />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:title" content="umbo.ngo" />
  <meta property="og:description" content="Short links, made quick." />
  <meta property="og:image" content="https://umbo.ngo/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://umbo.ngo/" />
  <meta property="og:type" content="website" />
  <meta property="fb:app_id" content="811269275316635" />

  <style>
    :root {
      --bg: #0f1117;
      --bg-alt: #1a1f2e;
      --text: #e5e7eb;
      --text-dim: #94a3b8;
      --border: #2a2f3e;
      --accent: #F56400;
      --error: #f87171;
      --success: #4ade80;
    }
    :root[data-theme="light"] {
      --bg: #FAF7F4;
      --bg-alt: #FFFFFF;
      --text: #222222;
      --text-dim: #595959;
      --border: #D9D9D9;
      --accent: #F56400;
      --error: #c0392b;
      --success: #1e8449;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Consolas, monospace;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }
    p.lead {
      margin: 0 0 24px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .field { margin-bottom: 16px; }
    input[type="url"],
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .prefix-field {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      overflow: hidden;
    }
    .prefix-field span {
      padding: 10px 0 10px 12px;
      color: var(--text-dim);
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .prefix-field input {
      border: none;
      background: transparent;
      padding: 10px 12px 10px 2px;
    }
    .prefix-field input:focus { outline: none; }
    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: none;
    }
    .result.visible { display: block; }
    .result-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .result a {
      color: var(--accent);
      font-weight: bold;
      word-break: break-all;
      flex: 1;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--accent); }
    .message {
      margin-top: 12px;
      font-size: 0.85rem;
      display: none;
    }
    .message.visible { display: block; }
    .message.error { color: var(--error); }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">light mode</button>
  <div class="card">
    <h1>umbo.ngo</h1>
    <p class="lead">Paste a long URL, get a short one back.</p>

    <form id="shortenForm">
      <div class="field">
        <label for="url">Long URL</label>
        <input type="url" id="url" name="url" placeholder="https://example.com/a/very/long/path" required />
      </div>
      <div class="field">
        <label for="slug">Custom alias (optional)</label>
        <div class="prefix-field">
          <span>umbo.ngo/</span>
          <input type="text" id="slug" name="slug" placeholder="my-link" pattern="[a-zA-Z0-9-]{3,32}" />
        </div>
      </div>
      <button type="submit" id="submitBtn">Shorten</button>
    </form>

    <div class="message error" id="errorMsg"></div>

    <div class="result" id="result">
      <div class="result-row">
        <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
        <button class="copy-btn" id="copyBtn" type="button">copy</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var themeBtn = document.getElementById("themeToggle");
        function apply(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          themeBtn.textContent = theme === "light" ? "dark mode" : "light mode";
        }
        apply(stored === "light" ? "light" : "dark");
        themeBtn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "light" ? "dark" : "light";
          apply(next);
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      } catch (e) {}
    })();

    var form = document.getElementById("shortenForm");
    var submitBtn = document.getElementById("submitBtn");
    var errorMsg = document.getElementById("errorMsg");
    var result = document.getElementById("result");
    var shortLink = document.getElementById("shortLink");
    var copyBtn = document.getElementById("copyBtn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorMsg.classList.remove("visible");
      result.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Shortening...";

      var url = document.getElementById("url").value.trim();
      var slug = document.getElementById("slug").value.trim();

      try {
        var res = await fetch("/api/create", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ url: url, slug: slug }),
        });
        var data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong");
        }

        shortLink.href = data.shortUrl;
        shortLink.textContent = data.shortUrl.replace("https://", "");
        result.classList.add("visible");
        copyBtn.textContent = "copy";
        form.reset();
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("visible");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Shorten";
      }
    });

    copyBtn.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        copyBtn.textContent = "copied";
        setTimeout(function () { copyBtn.textContent = "copy"; }, 1500);
      } catch (e) {}
    });
  </script>
</body>
</html>
