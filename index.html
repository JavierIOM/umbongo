<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>umbo.ngo</title>
  <meta name="description" content="Short links and a public file store." />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:title" content="umbo.ngo" />
  <meta property="og:description" content="Short links and a public file store." />
  <meta property="og:image" content="https://umbo.ngo/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://umbo.ngo/" />
  <meta property="og:type" content="website" />
  <meta property="fb:app_id" content="811269275316635" />

  <style>
    :root {
      --bg: #0f1117;
      --bg-alt: #1a1f2e;
      --text: #e5e7eb;
      --text-dim: #94a3b8;
      --border: #2a2f3e;
      --accent: #F56400;
    }
    :root[data-theme="light"] {
      --bg: #FAF7F4;
      --bg-alt: #FFFFFF;
      --text: #222222;
      --text-dim: #595959;
      --border: #D9D9D9;
      --accent: #F56400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Consolas, monospace;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 4px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .theme-toggle:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">light mode</button>
  <div class="card">
    <h1>umbo.ngo</h1>
    <p>Short links live here. Nothing to see on this page itself.</p>
  </div>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var btn = document.getElementById("themeToggle");
        function apply(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          btn.textContent = theme === "light" ? "dark mode" : "light mode";
        }
        apply(stored === "light" ? "light" : "dark");
        btn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "light" ? "dark" : "light";
          apply(next);
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      } catch (e) {}
    })();
  </script>
</body>
</html>
