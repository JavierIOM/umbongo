<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="10;url=/" />
  <title>umbongo - page not found</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #2b1055;
      --bg-2: #7a2063;
      --bg-3: #c2410c;
      --text: #fff8f0;
      --text-dim: #e9d5ff;
      --card-bg: rgba(20, 10, 35, 0.45);
      --card-border: rgba(255, 255, 255, 0.18);
      --accent: #F56400;
      --tagline: #ffd23f;
      --wordmark-1: #ffd23f;
      --wordmark-2: #F56400;
      --wordmark-3: #ff5d8f;
    }
    :root[data-theme="light"] {
      --bg-1: #fde7cf;
      --bg-2: #ffc3a0;
      --bg-3: #ffafbd;
      --text: #3a1050;
      --text-dim: #6b4080;
      --card-bg: rgba(255, 255, 255, 0.55);
      --card-border: rgba(58, 16, 80, 0.15);
      --accent: #F56400;
      --tagline: #c2410c;
      --wordmark-1: #c2410c;
      --wordmark-2: #F56400;
      --wordmark-3: #e0247a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      color: var(--text);
      font-family: 'JetBrains Mono', Consolas, monospace;
      padding: 24px;
      text-align: center;
    }
    .fruits { display: flex; gap: 14px; margin-bottom: 8px; font-size: 2rem; line-height: 1; }
    h1.wordmark {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 3.2rem;
      margin: 4px 0 0;
      background: linear-gradient(90deg, var(--wordmark-1), var(--wordmark-2) 50%, var(--wordmark-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.01em;
    }
    p.tagline {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-style: italic;
      color: var(--tagline);
      margin: 2px 0 28px;
      font-size: 1.15rem;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 32px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    .card h2 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.4rem;
      margin: 0 0 10px;
    }
    .card p {
      color: var(--text-dim);
      line-height: 1.5;
      margin: 0 0 18px;
      font-size: 0.92rem;
    }
    .card a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .card a:hover { text-decoration: underline; }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .theme-toggle:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">light mode</button>

  <div class="fruits" aria-hidden="true">
    <span>&#x1F96D;</span>
    <span>&#x1F34D;</span>
    <span>&#x1F95D;</span>
    <span>&#x1F34C;</span>
    <span>&#x1F965;</span>
  </div>

  <h1 class="wordmark">umbongo</h1>
  <p class="tagline">they drink it in the congo</p>

  <div class="card">
    <h2>Page not found</h2>
    <p>That page doesn't exist. Taking you home in <span id="countdown">10</span>s, or <a href="/">click here</a>.</p>
  </div>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var themeBtn = document.getElementById("themeToggle");
        function apply(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          themeBtn.textContent = theme === "light" ? "dark mode" : "light mode";
        }
        apply(stored === "light" ? "light" : "dark");
        themeBtn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme");
          var next = current === "light" ? "dark" : "light";
          apply(next);
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      } catch (e) {}
    })();

    var remaining = 10;
    var countdownEl = document.getElementById("countdown");
    var timer = setInterval(function () {
      remaining -= 1;
      countdownEl.textContent = remaining > 0 ? remaining : 0;
      if (remaining <= 0) {
        clearInterval(timer);
        window.location.href = "/";
      }
    }, 1000);
  </script>
</body>
</html>
